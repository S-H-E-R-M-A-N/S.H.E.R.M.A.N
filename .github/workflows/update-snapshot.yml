name: Update satellite snapshot
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch snapshot from Space-Track
        run: python sherman_fetch.py --force
        env:
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
      - name: Commit if changed
        run: |
          git config user.name "sherman-bot"
          git config user.email "sherman-bot@users.noreply.github.com"
          git add snapshot.json
          if ! git diff --cached --quiet; then git commit -m "Update snapshot" && git push; fi
