#panel-body::-webkit-scrollbar-thumb,ul::-webkit-scrollbar-thumb{background:#008833;border-radius:2px}

p{margin:0 0 8px;color:#00b347;font-size:11px;text-transform:uppercase;letter-spacing:.05em}

select{width:100%;background:#031206;color:#00ff66;border:1px solid #00aa44;border-radius:3px;padding:6px 8px;outline:none}

label.g{display:flex;gap:8px;align-items:center;margin:8px 0 4px;font-weight:600;font-size:12px;color:#00ff66;cursor:pointer}

.sec{border-top:1px dashed #006622;margin-top:10px;padding-top:10px}

.vid button,#clear{background:#04180a;color:#00ff66;border:1px solid #00aa44;border-radius:3px;padding:5px 10px;cursor:pointer;margin-right:4px;margin-top:4px;font-size:11px;text-transform:uppercase;transition:all .2s ease}

let countries=[],hl=[],cur=null;

try{loaderText.textContent="[SYS_MAP] Loading vector sector boundaries...";const res=await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json");if(!res.ok)throw new Error("HTTP "+res.status);const topo=await res.json();const fc=topojson.feature(topo,topo.objects.countries);countries=fc.features.filter(f=>f.geometry&&f.properties.name).map(f=>({name:f.properties.name,polys:f.geometry.type==="Polygon"?[f.geometry.coordinates]:f.geometry.coordinates}));countries.sort((a,b)=>a.name.localeCompare(b.name));const sel=$("country");countries.forEach((c,i)=>{const o=document.createElement("option");o.value=i;o.textContent=c.name;sel.appendChild(o);c.polys.forEach(p=>viewer.entities.add({polyline:{positions:Cesium.Cartesian3.fromDegreesArrayHeights(p[0].flatMap(q=>[q[0],q[1],4000])),width:1,material:Cesium.Color.fromCssColorString("#00ff66").withAlpha(.35)}}))})}catch(e){console.warn("Boundary load failed:",e);$("above").innerHTML="<p>[ERROR] Could not load sector map boundaries.</p>"}
function pickCountry(c,fly){hl.forEach(e=>viewer.entities.remove(e));hl=[];cur=c;$("country").value=c?countries.indexOf(c):"";if(c){c.polys.forEach(p=>hl.push(viewer.entities.add({polygon:{hierarchy:new Cesium.PolygonHierarchy(Cesium.Cartesian3.fromDegreesArray(p[0].flat()),p.slice(1).map(h=>new Cesium.PolygonHierarchy(Cesium.Cartesian3.fromDegreesArray(h.flat())))),material:Cesium.Color.fromCssColorString("#00ff66").withAlpha(.2),height:0}})));if(fly){let a=1e9,b=1e9,x=-1e9,y=-1e9;c.polys.forEach(p=>p[0].forEach(q=>{a=Math.min(a,q[0]);x=Math.max(x,q[0]);b=Math.min(b,q[1]);y=Math.max(y,q[1])}));if(x-a>180){a=-180;x=180}const pad=Math.max(3,(x-a)*.4);viewer.camera.flyTo({destination:Cesium.Rectangle.fromDegrees(Math.max(-180,a-pad),Math.max(-85,b-pad),Math.min(180,x+pad),Math.min(85,y+pad))})}}refresh()}
let listKey="",listBtns=[];const hitText=h=>`> ${h.o.name} | ${h.alt} km`;
function refresh(){const el=$("above"),d=Cesium.JulianDate.toDate(viewer.clock.currentTime),hits=[];live.forEach(o=>{let hit=false;if(cur&&o.entity.show){const p=o.fn(d);if(p&&inCountry(cur,p.lon,p.lat)){hit=true;hits.push({o,alt:Math.round(p.alt)})}}if(o.hit!==hit){o.hit=hit;const e=o.entity;e.point.pixelSize=hit?12:6;e.point.color=hit?HIT_COLOR:o.color;e.label.show=hit}});if(!cur){if(listKey!=="none"){listKey="none";listBtns=[];el.innerHTML="<p>Select sector to initialize satellite trace.</p>"}return}hits.sort((a,b)=>a.o.name.localeCompare(b.o.name));const key=cur.name+"|"+hits.map(h=>h.o.name).join("\n");if(key===listKey){listBtns.forEach((b,i)=>{b.textContent=hitText(hits[i])});return}listKey=key;const p=document.createElement("p"),n1=document.createElement("b"),n2=document.createElement("b");n1.textContent="["+hits.length+"]";n2.textContent=cur.name;p.append(n1," "+(real?"":"demo ")+"targets over sector ",n2);const ul=document.createElement("ul");listBtns=[];hits.forEach(h=>{const li=document.createElement("li"),b=document.createElement("button");b.textContent=hitText(h);b.onclick=()=>selectSatellite(h.o);li.appendChild(b);ul.appendChild(li);listBtns.push(b)});el.replaceChildren(p,ul)}
let trackedSat=null;const infoPanel=$("info-panel");
function selectSatellite(o){trackedSat=o;viewer.trackedEntity=o.entity;viewer.selectedEntity=o.entity;infoPanel.style.display="block";$("info-feed").textContent=o.info||"";updateInfo()}
function stopTracking(){trackedSat=null;viewer.trackedEntity=undefined;viewer.selectedEntity=undefined;infoPanel.style.display="none"}
function updateInfo(){if(!trackedSat)return;const p=trackedSat.fn(Cesium.JulianDate.toDate(viewer.clock.currentTime));if(!p)return;$("info-name").textContent=trackedSat.name;$("info-group").textContent=trackedSat.group;$("info-alt").textContent=p.alt+" km";$("info-lat").textContent=p.lat.toFixed(2)+"°";$("info-lon").textContent=p.lon.toFixed(2)+"°";$("info-vel").textContent=p.vel+" km/s";$("info-period").textContent=p.period+(p.period==="-"?"":" min")}
$("info-close").onclick=stopTracking;$("info-dock").onclick=()=>infoPanel.classList.toggle("docked-side");
$("country").onchange=e=>pickCountry(e.target.value===""?null:countries[+e.target.value],true);$("clear").onclick=()=>pickCountry(null);
viewer.screenSpaceEventHandler.setInputAction(m=>{const pk=viewer.scene.pick(m.position);if(pk&&pk.id&&pk.id.isSat){selectSatellite(pk.id.satData);return}const cart=viewer.camera.pickEllipsoid(m.position,viewer.scene.globe.ellipsoid);if(cart){const g=Cesium.Cartographic.fromCartesian(cart),lon=Cesium.Math.toDegrees(g.longitude),lat=Cesium.Math.toDegrees(g.latitude);pickCountry(countries.find(c=>inCountry(c,lon,lat))||null,false)}else pickCountry(null,false)},Cesium.ScreenSpaceEventType.LEFT_CLICK);
const panelBody=$("panel-body"),hideBtn=$("hide");hideBtn.onclick=()=>{const col=panelBody.classList.toggle("collapsed");hideBtn.textContent=col?"Show":"Hide"};
const btnPause=$("btn-pause"),timeDisplay=$("time-display");
btnPause.onclick=()=>{clock.shouldAnimate=!clock.shouldAnimate;btnPause.textContent=clock.shouldAnimate?"❚❚":"▶";btnPause.classList.toggle("active",!clock.shouldAnimate)};
$("btn-live").onclick=()=>{clock.currentTime=Cesium.JulianDate.now();clock.multiplier=1;clock.shouldAnimate=true;btnPause.textContent="❚❚";btnPause.classList.remove("active");document.querySelectorAll(".speed-btn").forEach(b=>b.classList.toggle("active",b.dataset.s==="1"))};
document.querySelectorAll(".speed-btn").forEach(b=>{b.onclick=()=>{clock.multiplier=parseFloat(b.dataset.s);document.querySelectorAll(".speed-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active")}});
let lastRef=0,lastInfo=0,lastIso="";
clock.onTick.addEventListener(()=>{const now=Date.now(),iso=Cesium.JulianDate.toDate(clock.currentTime).toISOString().replace("T"," ").slice(0,19)+" UTC";if(iso!==lastIso){lastIso=iso;timeDisplay.textContent=iso}if(trackedSat&&now-lastInfo>200){lastInfo=now;updateInfo()}if(cur&&now-lastRef>1000){lastRef=now;refresh()}});
document.querySelectorAll(".vid button").forEach(b=>b.onclick=()=>{const c=b.dataset.c,v=$("vframe");v.innerHTML=c?`<iframe src="https://www.youtube.com/embed/live_stream?channel=${encodeURIComponent(c)}&autoplay=1&mute=1" title="Live video" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`:""});
}
})();
</script>
