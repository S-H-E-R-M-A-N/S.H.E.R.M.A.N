<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S.H.E.R.M.A.N | Full-globe satellite viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css">
<style>
html,body,#globe{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font:14px/1.45 system-ui,sans-serif}
#panel{position:absolute;top:10px;left:10px;z-index:5;width:min(330px,calc(100% - 20px));max-height:calc(100% - 20px);overflow-y:auto;background:rgba(10,20,34,.9);color:#e6edf5;border:1px solid #22344b;border-radius:6px;padding:12px}
h1{margin:0 0 2px;font-size:22px;letter-spacing:.08em}
p{margin:0 0 8px;color:#8da0b5;font-size:12px}
label.g{display:flex;gap:6px;align-items:center;margin:6px 0 2px;font-weight:600}
ul{list-style:none;margin:0 0 6px;padding:0;max-height:26vh;overflow-y:auto}
li button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:4px 6px;border-radius:4px;cursor:pointer;font:inherit}
li button:hover,li button:focus-visible{background:#1b2d45;outline:none}
.vid button{background:#1b2d45;color:#e6edf5;border:1px solid #2c4666;border-radius:4px;padding:4px 10px;cursor:pointer;margin-right:6px}
.vid iframe{width:100%;aspect-ratio:16/9;border:0;margin-top:8px;background:#000}
#hide{float:right;background:none;border:0;color:#8da0b5;cursor:pointer}
</style>
</head>
<body>
<div id="globe"></div>
<div id="panel">
<button id="hide" aria-label="Hide panel">Hide</button>
<h1>S.H.E.R.M.A.N</h1>
<p id="note">Loading…</p>
<div id="groups"></div>
<div class="vid"><b>Live video</b><br>
<button data-c="UCLA_DiR1FfKNvjuUpBHmylQ">NASA</button><button data-c="UCtI0Hodo5o5dUb67FeUjDeA">SpaceX</button><button data-c="">Close</button>
<div id="vframe"></div><p>Plays the channel's current live stream. Blank means it is not live or embedding is off.</p></div>
</div>
<script>
window.CESIUM_BASE_URL="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/";
// Optional: paste a free Cesium ion token for sharper satellite imagery. Leave empty to use the bundled Natural Earth map.
const ION_TOKEN="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6InNqblJocy0wWVM1YUUyWHIiLCJqdGkiOiIxMzZiNjA0ZC02MWVmLTRlMjktOGJjMi1iYmE2ZWMzZWVkNzgiLCJpZCI6NTE4MzEyLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3OTE1MTM0MTh9.tlxWHfwVpGRQYxZyHeKr8QcNKsUcakL5NYsl7MEBsNo";
</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script>
(async()=>{
const viewer=new Cesium.Viewer("globe",{baseLayer:false,baseLayerPicker:false,geocoder:false,homeButton:true,sceneModePicker:true,navigationHelpButton:false,infoBox:true,selectionIndicator:true,timeline:true,animation:true,fullscreenButton:true});
try{
 if(ION_TOKEN){Cesium.Ion.defaultAccessToken=ION_TOKEN;viewer.imageryLayers.add(await Cesium.ImageryLayer.fromProviderAsync(Cesium.createWorldImageryAsync()))}
 else viewer.imageryLayers.add(Cesium.ImageryLayer.fromProviderAsync(Cesium.TileMapServiceImageryProvider.fromUrl(Cesium.buildModuleUrl("Assets/Textures/NaturalEarthII"))));
}catch(e){console.warn("imagery failed",e)}
viewer.scene.globe.enableLighting=true;
const COL={NASA:Cesium.Color.DODGERBLUE,SpaceX:Cesium.Color.WHITE,Junk:Cesium.Color.RED};
const NAMES={NASA:"NASA satellites",SpaceX:"SpaceX satellites",Junk:"Space junk"};
const MU=398600.4418,RE=6378.137,WE=7.2921159e-5,D=Math.PI/180;
const start=Cesium.JulianDate.now();
function circ(alt,inc,raan,ph){const r=RE+alt,n=Math.sqrt(MU/r**3);return d=>{const t=(d-start.dayNumber*0)/1000%1e9;const s=(d.getTime()-Cesium.JulianDate.toDate(start).getTime())/1000,u=ph*D+n*s,c=Math.cos,sn=Math.sin,I=inc*D,R=raan*D;
const x=c(R)*c(u)-sn(R)*sn(u)*c(I),y=sn(R)*c(u)+c(R)*sn(u)*c(I),z=sn(u)*sn(I);let lon=Math.atan2(y,x)-WE*s;lon=((lon+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;return{lat:Math.asin(z)/D,lon:lon/D,alt}}}
function demo(){return[["ISS (demo)","NASA",420,51.6,40,10],["Hubble (demo)","NASA",535,28.5,200,80],["Terra (demo)","NASA",705,98.2,110,150],["Landsat 9 (demo)","NASA",705,98.2,60,330],
["Starlink A (demo)","SpaceX",550,53,10,0],["Starlink B (demo)","SpaceX",560,97.6,150,120],["Crew Dragon (demo)","SpaceX",420,51.6,40,25],
["Cosmos 2251 debris (demo)","Junk",790,74,300,40],["Fengyun-1C debris (demo)","Junk",850,98.8,20,200],["Iridium 33 debris (demo)","Junk",780,86.4,250,300]]
.map(a=>({name:a[0],group:a[1],info:"Demo orbit, not a real position",fn:circ(a[2],a[3],a[4],a[5])}))}
function fromTle(a){const sr=satellite.twoline2satrec(a.line1,a.line2);
return{name:a.name,group:a.group,info:"Space-Track gp, epoch "+a.epoch.slice(0,10),fn:d=>{const r=satellite.propagate(sr,d);if(!r.position)return null;
const p=satellite.eciToGeodetic(r.position,satellite.gstime(d));return{lat:satellite.degreesLat(p.latitude),lon:satellite.degreesLong(p.longitude),alt:p.height}}}}
let objs=[],note="";
try{const r=await fetch("snapshot.json",{cache:"no-store"});if(!r.ok)throw 0;const s=await r.json();
 objs=s.objects.map(a=>{try{return fromTle(a)}catch(e){return null}}).filter(Boolean);note="Real orbits, "+objs.length+" objects, data from "+s.fetched+"."}catch(e){}
if(!objs.length){objs=demo();note="Demo orbits. Add snapshot.json (see README) for real satellites."}
const startDate=Cesium.JulianDate.toDate(start),groups={};
objs.forEach((o,i)=>{const pos=new Cesium.SampledPositionProperty(Cesium.ReferenceFrame.FIXED);let n=0;
 for(let k=-5400;k<=5400;k+=30){const t=Cesium.JulianDate.addSeconds(start,k,new Cesium.JulianDate()),p=o.fn(Cesium.JulianDate.toDate(t));if(!p)continue;pos.addSample(t,Cesium.Cartesian3.fromDegrees(p.lon,p.lat,p.alt*1000));n++}
 if(n<20)return;
 pos.setInterpolationOptions({interpolationDegree:3,interpolationAlgorithm:Cesium.LagrangePolynomialApproximation});
 const c=COL[o.group]||Cesium.Color.YELLOW;
 o.entity=viewer.entities.add({name:o.name,position:pos,description:`<p>${o.group==="Junk"?"Space debris":o.group+" satellite"}</p><p>${o.info}</p>`,
  point:{pixelSize:8,color:c,outlineColor:Cesium.Color.BLACK,outlineWidth:1},
  label:{text:o.name,font:"12px sans-serif",pixelOffset:new Cesium.Cartesian2(0,-16),showBackground:true,backgroundColor:Cesium.Color.BLACK.withAlpha(.6),scale:.9,distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,2.5e7)},
  path:{leadTime:2700,trailTime:2700,width:2,material:c.withAlpha(.75)}});
 (groups[o.group]=groups[o.group]||[]).push(o)});
const clock=viewer.clock;clock.startTime=Cesium.JulianDate.addSeconds(start,-5400,new Cesium.JulianDate());clock.stopTime=Cesium.JulianDate.addSeconds(start,5400,new Cesium.JulianDate());
clock.currentTime=start.clone();clock.clockRange=Cesium.ClockRange.LOOP_STOP;clock.multiplier=30;clock.shouldAnimate=true;viewer.timeline.zoomTo(clock.startTime,clock.stopTime);
document.getElementById("note").textContent=note;
const gdiv=document.getElementById("groups");
Object.keys(groups).forEach(g=>{const l=document.createElement("label");l.className="g";const cb=document.createElement("input");cb.type="checkbox";cb.checked=true;
 cb.onchange=()=>groups[g].forEach(o=>o.entity.show=cb.checked);l.append(cb,NAMES[g]||g);gdiv.appendChild(l);
 const ul=document.createElement("ul");groups[g].forEach(o=>{const li=document.createElement("li"),b=document.createElement("button");b.textContent=o.name;
  b.onclick=()=>{viewer.trackedEntity=o.entity;viewer.selectedEntity=o.entity};li.appendChild(b);ul.appendChild(li)});gdiv.appendChild(ul)});
document.querySelectorAll(".vid button").forEach(b=>b.onclick=()=>{const c=b.dataset.c,v=document.getElementById("vframe");
 v.innerHTML=c?`<iframe src="https://www.youtube.com/embed/live_stream?channel=${c}&autoplay=1&mute=1" title="Live video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`:""});
const panel=document.getElementById("panel"),hide=document.getElementById("hide");
hide.onclick=()=>{const c=[...panel.children].filter(x=>x!==hide),h=hide.textContent==="Hide";c.forEach(x=>x.style.display=h?"none":"");hide.textContent=h?"Show":"Hide"};
})();
</script>
</body>
</html>
